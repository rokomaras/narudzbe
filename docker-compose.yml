services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narudzbe}
      POSTGRES_USER: ${POSTGRES_USER:-narudzbe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narudzbe_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narudzbe_user}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
